[general]
static=yes
writeprotect=no
clearglobalvars=no

[default]
; ------------------------------------------------------------------------------
; Extension 8000: AI Tamil ↔ Sinhala Voice Translator (Auto Mode)
; ------------------------------------------------------------------------------
exten => 8000,1,NoOp(--- Incoming AI Voice Translator Call ---)
 same => n,Answer()
 same => n,Wait(1)
 ; Send UUID and connect audio stream to AudioSocket Bridge Service on port 9092
 same => n,AudioSocket(55555555-5555-5555-5555-555555555555,audiosocket-bridge:9092)
 same => n,Hangup()

; ------------------------------------------------------------------------------
; Extension 1001: Test Extension (Tamil Speaker)
; ------------------------------------------------------------------------------
exten => 1001,1,NoOp(--- Calling Test Extension 1001 ---)
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()

; ------------------------------------------------------------------------------
; Extension 1002: Test Extension (Sinhala Speaker)
; ------------------------------------------------------------------------------
exten => 1002,1,NoOp(--- Calling Test Extension 1002 ---)
 same => n,Dial(PJSIP/1002,30)
 same => n,Hangup()
