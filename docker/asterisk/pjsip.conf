; ==============================================================================
; Asterisk PJSIP Configuration for Tamil ↔ Sinhala Voice Translator
; ==============================================================================

; ------------------------------------------------------------------------------
; Transport
; ------------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ------------------------------------------------------------------------------
; Endpoint Templates
; ------------------------------------------------------------------------------
[endpoint-template](!)
type=endpoint
context=default
disallow=all
allow=ulaw,alaw,slin
direct_media=no

[auth-template](!)
type=auth
auth_type=userpass

[aor-template](!)
type=aor
max_contacts=2

; ------------------------------------------------------------------------------
; SIP Extension 1001 (Tamil Speaker Test Account)
; ------------------------------------------------------------------------------
[1001](endpoint-template)
auth=auth1001
aors=1001

[auth1001](auth-template)
username=1001
password=1001pass

[1001](aor-template)

; ------------------------------------------------------------------------------
; SIP Extension 1002 (Sinhala Speaker Test Account)
; ------------------------------------------------------------------------------
[1002](endpoint-template)
auth=auth1002
aors=1002

[auth1002](auth-template)
username=1002
password=1002pass

[1002](aor-template)
