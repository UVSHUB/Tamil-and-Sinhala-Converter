name: Keep Hugging Face Server Awake

on:
  schedule:
    - cron: "*/5 * * * *" # Runs every 5 minutes
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: curl -sSf https://hasenalbanna-voice-translator-backend.hf.space/api/v1/health || echo "Ping failed but continuing"
