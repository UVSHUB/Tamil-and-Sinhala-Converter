version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # Backend Service: FastAPI WebSocket & Gemini API Controller
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: translator-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/__pycache__
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # Frontend Service: React 19 SPA running behind Nginx
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: translator-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # ----------------------------------------------------------------------------
  # Reverse Proxy: Nginx Routing REST and WebSocket Traffic
  # ----------------------------------------------------------------------------
  nginx-proxy:
    image: nginx:alpine
    container_name: translator-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  # ----------------------------------------------------------------------------
  # AudioSocket Bridge: Bridges Asterisk TCP AudioSocket to Backend WebSockets
  # ----------------------------------------------------------------------------
  audiosocket-bridge:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: translator-audiosocket-bridge
    restart: unless-stopped
    command: python -m backend.asterisk.audiosocket_bridge
    ports:
      - "9092:9092"
    environment:
      - AUDIOSOCKET_HOST=0.0.0.0
      - AUDIOSOCKET_PORT=9092
      - BACKEND_WS_URL=ws://backend:8000/ws/translate-auto?voice=Aoede&room=asterisk_phone
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend

  # ----------------------------------------------------------------------------
  # Asterisk PBX: Handles SIP Phone Calls and Routes Audio via AudioSocket
  # ----------------------------------------------------------------------------
  asterisk:
    build:
      context: ./docker/asterisk
      dockerfile: Dockerfile
    container_name: translator-asterisk
    restart: unless-stopped
    ports:
      - "5060:5060/udp"
      - "10000-10099:10000-10099/udp"
    depends_on:
      - audiosocket-bridge

